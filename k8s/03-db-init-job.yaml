apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-db-schemas
  namespace: togglemaster
data:
  auth-init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO api_keys (name, key_hash, is_active)
    VALUES ('evaluation-service-internal', :'key_hash', true)
    ON CONFLICT (key_hash) DO NOTHING;

  flags-init.sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        description TEXT,
        is_enabled BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    DROP TRIGGER IF EXISTS set_timestamp ON flags;
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();

  targeting-init.sql: |
    CREATE TABLE IF NOT EXISTS targeting_rules (
        id SERIAL PRIMARY KEY,
        flag_name VARCHAR(100) UNIQUE NOT NULL,
        is_enabled BOOLEAN NOT NULL DEFAULT true,
        rules JSONB NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;
    DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;
    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON targeting_rules
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
apiVersion: batch/v1
kind: Job
metadata:
  name: togglemaster-db-init
  namespace: togglemaster
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: togglemaster-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:15.19-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Inicializando schema do auth-db..."
              KEY_HASH=$(printf "%s" "$SERVICE_API_KEY" | sha256sum | awk '{print $1}')
              psql "$DATABASE_URL_AUTH" -v key_hash="$KEY_HASH" -f /schemas/auth-init.sql
              echo "Inicializando schema do flags-db..."
              psql "$DATABASE_URL_FLAGS" -f /schemas/flags-init.sql
              echo "Inicializando schema do targeting-db..."
              psql "$DATABASE_URL_TARGETING" -f /schemas/targeting-init.sql
              echo "Todos os 3 bancos RDS foram inicializados com sucesso!"
          env:
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: SERVICE_API_KEY
            - name: DATABASE_URL_AUTH
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: DATABASE_URL_AUTH
            - name: DATABASE_URL_FLAGS
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: DATABASE_URL_FLAGS
            - name: DATABASE_URL_TARGETING
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: DATABASE_URL_TARGETING
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: schemas
              mountPath: /schemas
              readOnly: true
      volumes:
        - name: schemas
          configMap:
            name: togglemaster-db-schemas
