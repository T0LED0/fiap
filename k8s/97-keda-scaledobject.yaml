apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service-keda
  namespace: togglemaster
spec:
  scaleTargetRef:
    name: analytics-service
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.us-east-2.amazonaws.com/000000000000/togglemaster-events
        queueLength: "5"
        awsRegion: "us-east-2"
        identityOwner: operator
