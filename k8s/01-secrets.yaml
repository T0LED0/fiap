apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: togglemaster
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-2
      auth:
        jwt:
          serviceAccountRef:
            name: togglemaster-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: togglemaster-external-secret
  namespace: togglemaster
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: togglemaster-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: fiap-fase2-togglemaster-secrets
